
# ──────────────────────────────────────────────────────────────────────────────
# 企业 RAG + Agent 一键启动
# 使用方法：
#   1. 复制 .env.example 为 .env 并填入 OPENAI_API_KEY 等配置
#   2. docker compose up --build
#   3. 访问 http://localhost:8000/docs
# ──────────────────────────────────────────────────────────────────────────────

services:
  rag-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/data/chroma       # 向量库持久化
      - upload_data:/app/data/uploads      # 上传文件持久化
      - model_cache:/app/models            # BGE 模型缓存（首次下载后复用）
      - ./app:/app/app                     # 开发热重载（生产可去掉）
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
      - MODELSCOPE_CACHE=/app/models       # ModelScope 缓存路径
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s   # 首次启动需要下载模型，给足时间

volumes:
  chroma_data:
    driver: local
  upload_data:
    driver: local
  model_cache:
    driver: local            # 模型缓存卷，重启容器不重复下载
